services:
  star-house:
    image: ghcr.io/lu8010252/star-house:latest
    container_name: star-house
    restart: unless-stopped
    ports:
      - "8020:8020"
    environment:
      - PORT=8020
      - PASSWORD=123456        # 登录密码,务必修改
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/data           # 数据(db.json + 上传的图片)
