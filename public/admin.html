<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星糖日记 · 家长后台</title>
<link rel="stylesheet" href="/style.css">
<style>
 header { position: sticky; top: 0; z-index: 5; background: linear-gradient(90deg, var(--pink), var(--purple)); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
 header h1 { margin: 0; font-size: 18px; } header a { color: #fff; opacity: .85; margin-left: auto; font-size: 14px; text-decoration: none; }
 #tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px; background: #fff; border-bottom: 1px solid var(--purple-l); }
 #tabs button { flex: none; padding: 8px 16px; border-radius: 18px; background: var(--purple-l); font-weight: 700; color: var(--purple-d); }
 #tabs button.on { background: var(--purple); color: #fff; }
 main { max-width: 900px; margin: 0 auto; padding: 16px 14px 60px; }
 .box { background: #fff; border-radius: 20px; padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 0 var(--purple-l); }
 .box h3 { margin: 0 0 12px; border-left: 5px solid var(--purple); padding-left: 10px; }
 .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; } .stats div { background: var(--purple-l); border-radius: 14px; padding: 10px 12px; } .stats small { color: var(--ink2); } .stats b { display: block; font-size: 24px; }
 .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
 select, input[type=text], input[type=number], input:not([type]) { padding: 8px 10px; border-radius: 10px; border: 2px solid var(--purple-l); outline: 0; max-width: 100%; }
 .ed { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px dashed var(--purple-l); }
 .ed input[data-k=name] { flex: 1; min-width: 120px; } .ed input[type=number] { width: 80px; }
 .b { padding: 8px 14px; border-radius: 12px; background: var(--purple); color: #fff; font-weight: 700; } .b.r { background: var(--red); } .b.g { background: var(--purple-l); color: var(--purple-d); }
 table { width: 100%; border-collapse: collapse; font-size: 14px; } td, th { padding: 8px 6px; border-bottom: 1px solid var(--purple-l); text-align: left; }
 .p { color: #1e9c78; font-weight: 800; } .n { color: #e0455e; font-weight: 800; }
 .ava { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--pink-l); display: inline-grid; place-items: center; font-weight: 800; color: var(--pink-d); }
 .legend span { margin-right: 14px; font-size: 13px; } .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
 .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; } @media (max-width: 600px) { .cmp, .stats { grid-template-columns: 1fr; } }
 .hr { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 5px 0; } .hr .t { flex: 1; background: #f4effc; border-radius: 8px; overflow: hidden; } .hr .t i { display: block; height: 14px; border-radius: 8px; }
</style>
</head>
<body>
<header><h1>⭐ 星糖日记 · 家长后台</h1><a href="/">打开手机前台 →</a></header>
<div id="tabs"></div>
<main id="main"></main>
<div id="toast"></div>
<script src="/common.js"></script>
<script src="/admin.js"></script>
</body>
</html>
