name: Build APK

# 触发方式:① 手动运行(可临时填服务器地址) ② 推送 v* 标签,如 git tag v1.0.0 && git push --tags
# 服务器地址默认取仓库变量 SERVER_URL(Settings → Secrets and variables → Actions → Variables)
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: '服务器地址(留空则用仓库变量 SERVER_URL),如 https://home.example.com 或 http://192.168.0.10:8020'
        required: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SERVER_URL: ${{ github.event.inputs.server_url || vars.SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: 检查服务器地址
        run: |
          [ -n "$SERVER_URL" ] || { echo "::error::未设置服务器地址:请在仓库变量里加 SERVER_URL,或手动运行时填写"; exit 1; }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: 生成 Capacitor 配置
        working-directory: app
        run: |
          node -e '
          const fs = require("fs");
          let raw = process.env.SERVER_URL.trim();
          if (!/^https?:\/\//i.test(raw)) raw = "https://" + raw;   // 没写协议时自动补 https
          const url = new URL(raw);
          const u = url.origin;                                      // 只保留 协议+域名+端口
          const http = url.protocol === "http:";
          fs.writeFileSync("capacitor.config.json", JSON.stringify({
            appId: "com.starhouse.app", appName: "星星屋", webDir: "www",
            server: { url: u, cleartext: http, androidScheme: http ? "http" : "https", allowNavigation: [url.host], errorPath: "error.html" },
            android: { allowMixedContent: true }
          }, null, 2));
          fs.writeFileSync("www/error.html", fs.readFileSync("www/error.html", "utf8").replace(/__SERVER_URL__/g, u));
          console.log("APK 将加载:", u);'

      - name: 创建 Android 工程
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: 加入原生闹钟提醒插件(锁屏到点响铃)
        working-directory: app/android
        run: |
          cp ../native/*.java app/src/main/java/com/starhouse/app/
          sed -i 's#<application#<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <application#' app/src/main/AndroidManifest.xml
          sed -i 's#</application>#    <receiver android:name=".StarAlarmReceiver" android:exported="false"/>\n    <service android:name=".StarFocusService" android:exported="false" android:foregroundServiceType="specialUse"><property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="focus_timer"/></service>\n    </application>#' app/src/main/AndroidManifest.xml
          grep -n "StarAlarmReceiver\|StarFocusService\|FOREGROUND" app/src/main/AndroidManifest.xml
          ls app/src/main/java/com/starhouse/app/

      - name: 状态栏/导航栏配色(与页面一致,深色图标)
        working-directory: app/android/app/src/main/res/values
        run: |
          sed -i 's#<item name="android:background">@null</item>#&\n        <item name="android:statusBarColor">\#FFEEF6</item>\n        <item name="android:navigationBarColor">\#FFF7FB</item>\n        <item name="android:windowLightStatusBar">true</item>\n        <item name="android:windowLightNavigationBar">true</item>#' styles.xml
          cat styles.xml

      - name: 构建 APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: 重命名
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk star-house.apk

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('apk-{0}', github.run_number) }}
          name: 星星屋 APK ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('#{0}', github.run_number) }}
          body: |
            星星屋 Android 安装包(调试签名,可直接安装)。
            加载的服务器地址:${{ env.SERVER_URL }}
          files: star-house.apk
