name: Build APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: '服务器地址(手机能访问到的,如 https://diary.example.com 或 http://192.168.0.10:8020)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: 生成 Capacitor 配置
        working-directory: app
        env:
          SERVER_URL: ${{ github.event.inputs.server_url }}
        run: |
          node -e '
          const u = process.env.SERVER_URL.replace(/\/+$/, "");
          require("fs").writeFileSync("capacitor.config.json", JSON.stringify({
            appId: "com.starhouse.app", appName: "星星屋", webDir: "www",
            server: { url: u, cleartext: u.startsWith("http://"), androidScheme: u.startsWith("http://") ? "http" : "https" },
            android: { allowMixedContent: true }
          }, null, 2));'
          cat capacitor.config.json

      - name: 安装依赖并创建 Android 工程
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: 允许图片选择/相机(Manifest 权限)
        working-directory: app/android/app/src/main
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <application#' AndroidManifest.xml

      - name: 构建 APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: star-house-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
